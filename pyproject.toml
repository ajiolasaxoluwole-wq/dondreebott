[project]
name = "dondreebot"
version = "1.0.0"
description = "Telegram bot for calculations and conversions"
requires-python = ">=3.11.0"
dependencies = [
    "python-telegram-bot==20.7",
    "python-dotenv==1.0.0",
    "pytz==2023.3"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
